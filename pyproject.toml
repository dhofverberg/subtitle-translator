[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "subtitle-translator"
version = "0.1.0"
description = "AI-powered subtitle translator for SRT files, supporting OpenAI and Gemini."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "Daniel Hofverberg" }
]

keywords = [
    "subtitle",
    "translation",
    "srt",
    "openai",
    "gemini",
    "ai",
    "llm",
    "localization",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Utilities",
]

dependencies = [
    "click>=8.5.0",
    "typer>=0.27.2",
    "srt>=3.5.3"
]

[project.urls]
"Homepage" = "https://github.com/dhofverberg/subtitle-translator"
"Source" = "https://github.com/dhofverberg/subtitle-translator"
"Bug Tracker" = "https://github.com/dhofverberg/subtitle-translator/issues"
"Changelog" = "https://github.com/dhofverberg/subtitle-translator/blob/main/CHANGELOG.md"

[project.optional-dependencies]
openai = [
    "openai>=1.99",
]
gemini = [
    "google-genai>=1.0",
]
all = [
    "openai>=1.99",
    "google-genai>=1.0",
]
dev = [
    "build>=1.6.0",
    "packaging>=24",
    "pytest>=8",
    "ruff>=0.12"
]

[project.scripts]
subtitle-translator = "subtitle_translator.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
subtitle_translator = ["resources/*", "resources/**/*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
