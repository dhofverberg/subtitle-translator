name: Bug report
description: Report unexpected behavior or an error
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please fill in as much detail as possible.
        **Never include real API keys or private subtitle content.**

  - type: input
    id: version
    attributes:
      label: Package version
      description: Run `subtitle-translator --version` to find this.
      placeholder: "0.9.0"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.3"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Ubuntu 24.04 / macOS 14.5 / Windows 11"
    validations:
      required: true

  - type: input
    id: extras
    attributes:
      label: Installation extras
      description: Which extras did you install?
      placeholder: "e.g. [openai], [gemini], [all]"
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options:
        - openai
        - gemini
        - "not applicable"
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Model name
      description: >
        If you used `--model` or `--review-model`, enter the model name here.
        Do not include API keys.
      placeholder: "e.g. gpt-5.5 or gemini-2.5-flash"

  - type: textarea
    id: command
    attributes:
      label: Command
      description: >
        The command you ran, with all credentials and personal paths removed.
        Replace real file paths with generic placeholders.
      placeholder: |
        subtitle-translator translate movie.srt \
          --provider openai \
          --source-language English \
          --target-language Swedish
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: Error output
      description: >
        Paste any error messages or relevant output here. Remove credentials,
        API keys, and personal data.
      render: text

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction SRT
      description: >
        If the issue involves a specific subtitle file, provide a short
        synthetic SRT that reproduces the problem. Do not paste copyrighted
        content.
      render: text

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that may help diagnose the issue.
